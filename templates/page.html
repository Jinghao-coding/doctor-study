<script src="{{script_path}}"></script>
<script>
(function(){
  function syncPrismTheme(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var light = document.getElementById('prism-light');
    var dark2 = document.getElementById('prism-dark');
    if(light) light.disabled = dark;
    if(dark2) dark2.disabled = !dark;
  }
  syncPrismTheme();
  var mo = new MutationObserver(syncPrismTheme);
  mo.observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncPrismTheme);
})();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" crossorigin="anonymous"></script>
