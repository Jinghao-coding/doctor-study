<a class="idx-card {{color}}" href="{{href}}" data-progress-key="{{progress_key}}" data-progress-total="{{progress_total}}">
  <div class="idx-card-top">
    <div class="idx-card-icon"></div>
    <span class="idx-card-progress" hidden><span class="idx-card-progress-text">0 / {{progress_total}}</span></span>
    <span class="idx-card-arrow">打开</span>
  </div>
  <div class="idx-title">{{title}}</div>
  <div class="idx-desc">{{description}}</div>
  <div class="idx-tags" aria-label="标签">{{tags}}</div>
</a>
