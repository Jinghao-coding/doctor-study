name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build site
        run: |
          set -euo pipefail
          python tools/build_site.py

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m py_compile tools/build_site.py

      - name: Verify internal links
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          root = Path('.')
          missing = []

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  href = dict(attrs).get('href') if tag == 'a' else None
                  if href and not href.startswith(('#', 'http:', 'https:', 'mailto:', 'javascript:', 'data:')):
                      self.hrefs.append(href.split('#', 1)[0])

          for path in [root / 'index.html', *sorted((root / 'pages').rglob('*.html'))]:
              parser = Parser()
              parser.feed(path.read_text(encoding='utf-8'))
              for href in parser.hrefs:
                  target = (path.parent / href).resolve()
                  if not target.exists():
                      missing.append(f'{path} -> {href}')

          if missing:
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'all html links ok ({sum(1 for _ in (root / "pages").rglob("*.html")) + 1} pages checked)')
          PY

      - name: Verify generated files exist
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          test -d pages
          echo "index.html and directories verified"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R pages _site/pages
          if [ -d resources ]; then cp -R resources _site/resources; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
