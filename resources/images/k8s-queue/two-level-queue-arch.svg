<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="780" height="700" rx="14" fill="#ffffff"/>

  <!-- title -->
  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">两级队列：平台业务队列 + Volcano 调度队列</text>

  <!-- user submit -->
  <rect x="270" y="56" width="240" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">用户提交 TrainingJob (CRD)</text>

  <!-- admission webhook -->
  <rect x="230" y="118" width="320" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="390" y="139" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">Admission Webhook 合法性校验</text>
  <text x="390" y="157" text-anchor="middle" font-size="11" fill="#854d0e">身份 / team / 优先级权限 / 卡型 / 单任务 ≤ 团队 quota</text>

  <!-- LEVEL 1 group -->
  <rect x="40" y="186" width="700" height="244" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="58" y="208" font-size="13" font-weight="700" fill="#15803d">第一级 · 自研平台业务队列（source of truth）</text>

  <rect x="80" y="220" width="620" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="390" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Platform Queue Controller</text>
  <text x="390" y="257" text-anchor="middle" font-size="11" fill="#14532d">所有合法任务进入 Queued，永不因 quota 满而拒绝</text>

  <rect x="80" y="276" width="300" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="230" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Quota Manager</text>
  <text x="230" y="313" text-anchor="middle" font-size="11" fill="#14532d">team × gpuType：hard / used / reserved</text>

  <rect x="400" y="276" width="300" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="550" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Admission Scheduler</text>
  <text x="550" y="313" text-anchor="middle" font-size="11" fill="#14532d">priority / aging / reservation / backfill</text>

  <rect x="80" y="332" width="620" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="390" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">VolcanoJob Dispatcher</text>
  <text x="390" y="369" text-anchor="middle" font-size="11" fill="#14532d">reserve quota 成功后，才创建 VolcanoJob 下发给二级</text>

  <text x="390" y="404" text-anchor="middle" font-size="11" fill="#15803d">超额任务停在 Queued，不创建任何 Pod —— 排队发生在建 Pod 之前</text>

  <!-- LEVEL 2 group -->
  <rect x="40" y="448" width="700" height="116" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="58" y="470" font-size="13" font-weight="700" fill="#1d4ed8">第二级 · Volcano 调度队列（执行层 guardrail）</text>

  <rect x="80" y="482" width="620" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="390" y="504" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Volcano Scheduler</text>
  <text x="390" y="522" text-anchor="middle" font-size="11" fill="#1e3a8a">queue capability 兜底 · PodGroup · gang · allocate</text>
  <text x="390" y="538" text-anchor="middle" font-size="11" fill="#1e3a8a">preempt 执行 · binpack · topology-aware 放置</text>

  <!-- node -->
  <rect x="270" y="586" width="240" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="390" y="613" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Node / GPU 执行</text>

  <!-- feedback loop -->
  <path d="M 690 608 H 740 V 242 H 700" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text x="752" y="430" text-anchor="middle" font-size="10" fill="#6b7280" transform="rotate(90 752 430)">任务结束释放 quota，触发重算准入下一个</text>

  <!-- arrows -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <g stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <line x1="390" y1="100" x2="390" y2="116"/>
    <line x1="390" y1="168" x2="390" y2="218"/>
    <line x1="390" y1="376" x2="390" y2="480"/>
    <line x1="390" y1="544" x2="390" y2="584"/>
  </g>
</svg>
