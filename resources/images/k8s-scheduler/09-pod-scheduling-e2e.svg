<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Pod scheduling end-to-end path</title>
  <desc id="desc">From Pod creation through scheduler queue, scheduling cycle, binding cycle, API Server persistence, and kubelet execution.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #dbe4ef; stroke-width: 2; }
      .lane-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke-width: 2; rx: 14; }
      .api { stroke: #3b82f6; fill: #eff6ff; }
      .sched { stroke: #8b5cf6; fill: #f5f3ff; }
      .cycle { stroke: #06b6d4; fill: #ecfeff; }
      .bind { stroke: #22c55e; fill: #f0fdf4; }
      .node { stroke: #f59e0b; fill: #fffbeb; }
      .fail { stroke: #ef4444; fill: #fff1f2; }
      .label { font: 700 15px Inter, Arial, sans-serif; fill: #111827; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 11px Inter, Arial, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowSoft); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .caption { font: 700 13px Inter, Arial, sans-serif; fill: #334155; }
      .badge { fill: #0f172a; }
      .badge-text { font: 700 11px Inter, Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760" />
  <text x="42" y="46" style="font: 800 26px Inter, Arial, sans-serif; fill:#0f172a;">一次 Pod 调度的端到端路径</text>
  <text x="42" y="72" class="small">Scheduler 只负责选 Node 并写回绑定结果；真正创建容器发生在目标 Node 的 kubelet 侧。</text>

  <rect class="lane" x="35" y="105" width="245" height="575" rx="18" />
  <text x="58" y="137" class="lane-title">API / etcd</text>
  <text x="58" y="158" class="small">声明式状态存储</text>

  <rect class="lane" x="305" y="105" width="535" height="575" rx="18" />
  <text x="328" y="137" class="lane-title">kube-scheduler</text>
  <text x="328" y="158" class="small">watch 未绑定 Pod，选择目标 Node</text>

  <rect class="lane" x="865" y="105" width="370" height="575" rx="18" />
  <text x="888" y="137" class="lane-title">目标 Node / kubelet</text>
  <text x="888" y="158" class="small">watch 已绑定 Pod，准备并启动容器</text>

  <rect class="box api" x="60" y="195" width="190" height="72" />
  <text x="82" y="223" class="label">1. 创建 Pod</text>
  <text x="82" y="244" class="small">spec.nodeName 为空</text>
  <text x="82" y="260" class="tiny">kubectl / controller</text>

  <rect class="box api" x="60" y="325" width="190" height="72" />
  <text x="82" y="353" class="label">2. 写入 etcd</text>
  <text x="82" y="374" class="small">API Server 持久化</text>
  <text x="82" y="390" class="tiny">Pod 仍未调度</text>

  <rect class="box sched" x="330" y="185" width="210" height="78" />
  <text x="354" y="213" class="label">3. Informer / Watch</text>
  <text x="354" y="234" class="small">发现未绑定 Pod</text>
  <text x="354" y="251" class="tiny">nodeName == empty</text>

  <rect class="box sched" x="585" y="185" width="210" height="78" />
  <text x="609" y="213" class="label">4. Scheduling Queue</text>
  <text x="609" y="234" class="small">activeQ / backoffQ</text>
  <text x="609" y="251" class="tiny">unschedulableQ</text>

  <rect class="box cycle" x="330" y="315" width="210" height="96" />
  <text x="354" y="343" class="label">5. Scheduling Cycle</text>
  <text x="354" y="364" class="small">PreFilter → Filter</text>
  <text x="354" y="381" class="small">PostFilter if needed</text>
  <text x="354" y="398" class="small">PreScore → Score</text>

  <rect class="box cycle" x="585" y="315" width="210" height="96" />
  <text x="609" y="343" class="label">6. Select / Reserve</text>
  <text x="609" y="364" class="small">NormalizeScore</text>
  <text x="609" y="381" class="small">SelectHost / Assume</text>
  <text x="609" y="398" class="small">Reserve / Permit</text>

  <rect class="box fail" x="585" y="460" width="210" height="80" />
  <text x="609" y="489" class="label">PostFilter / 抢占</text>
  <text x="609" y="510" class="small">无 feasible node 时</text>
  <text x="609" y="527" class="tiny">nominatedNodeName</text>

  <rect class="box bind" x="330" y="580" width="210" height="76" />
  <text x="354" y="609" class="label">7. Binding Cycle</text>
  <text x="354" y="630" class="small">PreBind → Bind</text>
  <text x="354" y="647" class="tiny">PostBind / Unreserve</text>

  <rect class="box api" x="60" y="535" width="190" height="86" />
  <text x="82" y="564" class="label">8. 绑定结果</text>
  <text x="82" y="585" class="small">写回 API Server</text>
  <text x="82" y="602" class="tiny">spec.nodeName = node-a</text>

  <rect class="box node" x="895" y="210" width="290" height="84" />
  <text x="920" y="239" class="label">9. kubelet watch</text>
  <text x="920" y="260" class="small">只关注绑定到本节点的 Pod</text>
  <text x="920" y="277" class="tiny">spec.nodeName == current node</text>

  <rect class="box node" x="895" y="350" width="290" height="126" />
  <text x="920" y="379" class="label">10. SyncPod</text>
  <text x="920" y="400" class="small">准备 volume / sandbox</text>
  <text x="920" y="417" class="small">调用 CNI 配网络</text>
  <text x="920" y="434" class="small">通过 CRI 调 runtime</text>
  <text x="920" y="451" class="tiny">containerd → runc / kata / gVisor</text>

  <rect class="box node" x="895" y="535" width="290" height="86" />
  <text x="920" y="564" class="label">11. Pod Running</text>
  <text x="920" y="585" class="small">容器启动并上报状态</text>
  <text x="920" y="602" class="tiny">PodStatus / NodeStatus</text>

  <path class="arrow" d="M155 267 L155 325" />
  <path class="arrow" d="M250 360 C295 360 292 224 330 224" />
  <path class="arrow" d="M540 224 L585 224" />
  <path class="arrow" d="M690 263 L690 294 C690 304 530 304 435 315" />
  <path class="arrow" d="M540 363 L585 363" />
  <path class="arrow" d="M690 411 L690 460" />
  <path class="arrow-soft" d="M585 500 C515 500 475 468 450 411" />
  <path class="arrow" d="M585 618 L540 618" />
  <path class="arrow" d="M330 618 C285 618 280 578 250 578" />
  <path class="arrow" d="M250 578 C450 700 775 700 895 578" />
  <path class="arrow" d="M1040 294 L1040 350" />
  <path class="arrow" d="M1040 476 L1040 535" />

  <line class="divider" x1="852" y1="170" x2="852" y2="660" />
  <text x="732" y="698" class="caption">职责边界：Bind 之前是 scheduler 的决策；Bind 之后是 kubelet 的节点执行。</text>
  <rect class="badge" x="46" y="696" width="94" height="28" rx="14" />
  <text class="badge-text" x="65" y="714">记忆版</text>
  <text x="154" y="716" class="caption">Watch Pod → Queue → Filter → Score → Bind → Kubelet Run</text>
</svg>
