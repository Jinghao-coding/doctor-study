<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gGpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76b900"/><stop offset="100%" stop-color="#5a9400"/>
    </linearGradient>
    <linearGradient id="gNic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ed8936"/><stop offset="100%" stop-color="#c05621"/>
    </linearGradient>
    <linearGradient id="gCpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299e1"/><stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
    <linearGradient id="gNet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9f7aea"/><stop offset="100%" stop-color="#6b46c1"/>
    </linearGradient>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">跨机 GPU 通信：传统路径 vs GPUDirect RDMA</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#718096">核心区别：数据是否绕过 CPU 内存——GPUDirect 让 NIC 直接读写 GPU HBM，消除 host staging 拷贝</text>

  <!-- ====== TOP: Traditional path (bad, red tone) ====== -->
  <rect x="30" y="68" width="900" height="165" rx="12" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="68" width="900" height="30" rx="12" fill="#e53e3e"/>
  <rect x="30" y="92" width="900" height="6" fill="#e53e3e"/>
  <text x="480" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">❌ 传统路径（无 GPUDirect）：数据经过 CPU 内存中转，多 2~4 次拷贝</text>

  <!-- Server A components -->
  <rect x="60" y="115" width="85" height="45" rx="8" fill="url(#gGpu)"/>
  <text x="102" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">GPU0 HBM</text>
  <text x="102" y="150" text-anchor="middle" font-size="8" fill="#c6f6d5">Server A</text>

  <rect x="60" y="172" width="85" height="40" rx="8" fill="url(#gCpu)"/>
  <text x="102" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">CPU Memory</text>

  <rect x="195" y="140" width="80" height="45" rx="8" fill="url(#gNic)"/>
  <text x="235" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RDMA NIC</text>
  <text x="235" y="175" text-anchor="middle" font-size="8" fill="#feebc8">A</text>

  <!-- Network -->
  <rect x="320" y="148" width="120" height="30" rx="8" fill="url(#gNet)"/>
  <text x="380" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">IB/RoCE 网络</text>

  <!-- Server B components -->
  <rect x="485" y="140" width="80" height="45" rx="8" fill="url(#gNic)"/>
  <text x="525" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RDMA NIC</text>
  <text x="525" y="175" text-anchor="middle" font-size="8" fill="#feebc8">B</text>

  <rect x="610" y="172" width="85" height="40" rx="8" fill="url(#gCpu)"/>
  <text x="652" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">CPU Memory</text>

  <rect x="740" y="115" width="85" height="45" rx="8" fill="url(#gGpu)"/>
  <text x="782" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">GPU3 HBM</text>
  <text x="782" y="150" text-anchor="middle" font-size="8" fill="#c6f6d5">Server B</text>

  <!-- Traditional path arrows (red, showing 4 hops) -->
  <g stroke="#e53e3e" stroke-width="2" fill="#e53e3e">
    <line x1="145" y1="137" x2="145" y2="172" marker-end="url(#arrowR)"/>
    <line x1="145" y1="192" x2="195" y2="170" marker-end="url(#arrowR)"/>
    <line x1="275" y1="162" x2="320" y2="162" marker-end="url(#arrowR)"/>
    <line x1="440" y1="162" x2="485" y2="162" marker-end="url(#arrowR)"/>
    <line x1="565" y1="170" x2="610" y2="192" marker-end="url(#arrowR)"/>
    <line x1="652" y1="172" x2="652" y2="160" marker-end="url(#arrowR)"/>
    <path d="M652,160 L695,150 L740,137" fill="none" stroke-width="2"/>
    <polygon points="740,137 729,133 733,143" fill="#e53e3e"/>
  </g>
  <!-- step labels -->
  <text x="138" y="157" text-anchor="middle" font-size="8" fill="#e53e3e" font-weight="700">①</text>
  <text x="170" y="177" text-anchor="middle" font-size="8" fill="#e53e3e" font-weight="700">②</text>
  <text x="590" y="177" text-anchor="middle" font-size="8" fill="#e53e3e" font-weight="700">③</text>
  <text x="700" y="155" text-anchor="middle" font-size="8" fill="#e53e3e" font-weight="700">④</text>

  <text x="860" y="195" font-size="9" fill="#e53e3e">Host staging:</text>
  <text x="860" y="208" font-size="9" fill="#e53e3e">GPU→CPU→NIC→</text>
  <text x="860" y="221" font-size="9" fill="#e53e3e">→NIC→CPU→GPU</text>

  <!-- ====== BOTTOM: GPUDirect RDMA path (good, green tone) ====== -->
  <rect x="30" y="250" width="900" height="165" rx="12" fill="#f0fff4" stroke="#68d391" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="30" y="250" width="900" height="30" rx="12" fill="#38a169"/>
  <rect x="30" y="274" width="900" height="6" fill="#38a169"/>
  <text x="480" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">✅ GPUDirect RDMA 路径：NIC 直接读写 GPU HBM，绕过 CPU 内存</text>

  <!-- Server A components for GDR -->
  <rect x="60" y="297" width="85" height="45" rx="8" fill="url(#gGpu)"/>
  <text x="102" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">GPU0 HBM</text>
  <text x="102" y="332" text-anchor="middle" font-size="8" fill="#c6f6d5">Server A</text>

  <rect x="60" y="354" width="85" height="40" rx="8" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="102" y="378" text-anchor="middle" font-size="9" fill="#a0aec0">CPU（控制面）</text>

  <rect x="195" y="322" width="80" height="45" rx="8" fill="url(#gNic)"/>
  <text x="235" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RDMA NIC</text>
  <text x="235" y="357" text-anchor="middle" font-size="8" fill="#feebc8">A（直接 DMA）</text>

  <rect x="320" y="330" width="120" height="30" rx="8" fill="url(#gNet)"/>
  <text x="380" y="350" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">IB/RoCE 网络</text>

  <rect x="485" y="322" width="80" height="45" rx="8" fill="url(#gNic)"/>
  <text x="525" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RDMA NIC</text>
  <text x="525" y="357" text-anchor="middle" font-size="8" fill="#feebc8">B（直接 DMA）</text>

  <rect x="610" y="354" width="85" height="40" rx="8" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="652" y="378" text-anchor="middle" font-size="9" fill="#a0aec0">CPU（控制面）</text>

  <rect x="740" y="297" width="85" height="45" rx="8" fill="url(#gGpu)"/>
  <text x="782" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">GPU3 HBM</text>
  <text x="782" y="332" text-anchor="middle" font-size="8" fill="#c6f6d5">Server B</text>

  <!-- GDR path arrows (green, direct path) -->
  <g stroke="#38a169" stroke-width="2.5" fill="#38a169">
    <path d="M145,320 L180,335 L195,340" fill="none" marker-end="url(#arrowG)"/>
    <line x1="275" y1="344" x2="320" y2="344" marker-end="url(#arrowG)"/>
    <line x1="440" y1="344" x2="485" y2="344" marker-end="url(#arrowG)"/>
    <path d="M565,340 L600,335 L680,320 L740,318" fill="none" marker-end="url(#arrowG)"/>
  </g>
  <text x="860" y="348" font-size="9" fill="#38a169" font-weight="700">Direct path:</text>
  <text x="860" y="362" font-size="9" fill="#38a169">GPU HBM → PCIe → NIC →</text>
  <text x="860" y="375" font-size="9" fill="#38a169">→ NIC → PCIe → GPU HBM</text>
  <text x="860" y="392" font-size="9" fill="#68d391">CPU 仅做控制面：注册内存、</text>
  <text x="860" y="405" font-size="9" fill="#68d391">提交 WR、轮询 CQ</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38a169"/>
    </marker>
  </defs>

  <text x="480" y="430" text-anchor="middle" font-size="9" fill="#a0aec0">GPUDirect RDMA 相比传统路径可降低 30%~50% 延迟，显著提升 AllReduce 带宽，CPU 占用大幅降低</text>
</svg>