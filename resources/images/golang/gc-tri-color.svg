<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#555"/></marker>
    <style>
      .title{font-size:16px;font-weight:600;fill:#1a1a2e}
      .label{font-size:12px;fill:#333}
      .small{font-size:10px;fill:#777}
      .objw{fill:#fff}
    </style>
  </defs>
  <text x="400" y="28" text-anchor="middle" class="title">Go 三色标记 GC 过程</text>
  <rect x="30" y="50" width="200" height="280" rx="10" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
  <text x="130" y="75" text-anchor="middle" class="title" font-size="14">White Set (待回收)</text>
  <text x="130" y="92" text-anchor="middle" class="small">初始所有对象为白色</text>
  <circle cx="80" cy="120" r="18" fill="#fff" stroke="#999" stroke-width="2"/><text x="80" y="125" text-anchor="middle" class="label">A</text>
  <circle cx="160" cy="120" r="18" fill="#fff" stroke="#999" stroke-width="2"/><text x="160" y="125" text-anchor="middle" class="label">B</text>
  <circle cx="80" cy="180" r="18" fill="#fff" stroke="#999" stroke-width="2"/><text x="80" y="185" text-anchor="middle" class="label">C</text>
  <circle cx="160" cy="180" r="18" fill="#fff" stroke="#999" stroke-width="2"/><text x="160" y="185" text-anchor="middle" class="label">D</text>
  <circle cx="120" cy="240" r="18" fill="#fff" stroke="#999" stroke-width="2"/><text x="120" y="245" text-anchor="middle" class="label">E</text>
  <text x="130" y="290" text-anchor="middle" class="small">GC 结束仍为白色 → 回收</text>
  <rect x="300" y="50" width="200" height="280" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="75" text-anchor="middle" class="title" font-size="14">Gray Set (待扫描)</text>
  <text x="400" y="92" text-anchor="middle" class="small">已发现但子引用未扫描</text>
  <circle cx="400" cy="180" r="22" fill="#d4d4d4" stroke="#666" stroke-width="2"/><text x="400" y="186" text-anchor="middle" class="label" font-weight="600">Roots</text>
  <text x="400" y="290" text-anchor="middle" class="small">从栈/全局变量根对象开始</text>
  <rect x="570" y="50" width="200" height="280" rx="10" fill="#e8f5e9" stroke="#28a745" stroke-width="1.5"/>
  <text x="670" y="75" text-anchor="middle" class="title" font-size="14">Black Set (存活)</text>
  <text x="670" y="92" text-anchor="middle" class="small">自身及子引用均已扫描</text>
  <text x="670" y="290" text-anchor="middle" class="small">GC 后保留</text>
  <line x1="230" y1="140" x2="300" y2="170" stroke="#888" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr)"/>
  <text x="252" y="148" class="small">初始全部</text>
  <line x1="500" y1="180" x2="570" y2="180" stroke="#28a745" stroke-width="2" marker-end="url(#arr)"/>
  <text x="515" y="173" class="small">扫描完成</text>
  <line x1="300" y1="200" x2="230" y2="230" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="228" class="small">标记引用</text>
  <rect x="30" y="345" width="740" height="30" rx="5" fill="#f8f9fa" stroke="#ddd"/>
  <text x="400" y="365" text-anchor="middle" class="label">
    标记阶段:Root 置灰 → 逐个取出灰对象,将其引用的白对象置灰,自身置黑 → 直到灰集为空 → 白对象不可达,回收
  </text>
</svg>