<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a6fa5"/></marker>
    <style>.t{font-size:13px;font-weight:600}.l{font-size:11px;fill:#444}.box{rx:8;ry:8;stroke-width:1.5}</style>
  </defs>
  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Informer + Controller 工作链路</text>
  <rect x="30" y="50" width="120" height="60" class="box" fill="#f8d7da" stroke="#dc3545"/>
  <text x="90" y="75" text-anchor="middle" class="t" fill="#721c24">API Server</text>
  <text x="90" y="93" text-anchor="middle" class="l">etcd 持久化</text>
  <text x="90" y="105" text-anchor="middle" class="l">Watch 事件流</text>
  <rect x="200" y="50" width="110" height="60" class="box" fill="#fff3cd" stroke="#e6a700"/>
  <text x="255" y="75" text-anchor="middle" class="t" fill="#856404">Reflector</text>
  <text x="255" y="93" text-anchor="middle" class="l">ListAndWatch</text>
  <text x="255" y="105" text-anchor="middle" class="l">从 resourceVersion 续传</text>
  <rect x="360" y="50" width="120" height="60" class="box" fill="#e8f0fe" stroke="#0066cc"/>
  <text x="420" y="75" text-anchor="middle" class="t" fill="#004085">DeltaFIFO</text>
  <text x="420" y="93" text-anchor="middle" class="l">Added/Updated/</text>
  <text x="420" y="105" text-anchor="middle" class="l">Deleted/Sync Deltas</text>
  <rect x="530" y="50" width="110" height="60" class="box" fill="#d4edda" stroke="#28a745"/>
  <text x="585" y="75" text-anchor="middle" class="t" fill="#155724">Indexer</text>
  <text x="585" y="93" text-anchor="middle" class="l">Local Cache</text>
  <text x="585" y="105" text-anchor="middle" class="l">线程安全 + 索引</text>
  <rect x="680" y="50" width="100" height="60" class="box" fill="#f8d7da" stroke="#dc3545"/>
  <text x="730" y="75" text-anchor="middle" class="t" fill="#721c24">Lister</text>
  <text x="730" y="93" text-anchor="middle" class="l">读本地缓存</text>
  <text x="730" y="105" text-anchor="middle" class="l">(不打 API Server)</text>
  <line x1="150" y1="80" x2="200" y2="80" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="80" x2="360" y2="80" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="80" x2="530" y2="80" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="640" y1="80" x2="680" y2="80" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="140" text-anchor="middle" class="l">Pop from DeltaFIFO → Process (HandleDeltas) → 更新 Indexer → 分发 event handler</text>
  <rect x="200" y="170" width="130" height="60" class="box" fill="#fff3cd" stroke="#e6a700"/>
  <text x="265" y="195" text-anchor="middle" class="t" fill="#856404">Resource Event</text>
  <text x="265" y="213" text-anchor="middle" class="l">OnAdd/OnUpdate/</text>
  <text x="265" y="225" text-anchor="middle" class="l">OnDelete handlers</text>
  <rect x="400" y="170" width="160" height="60" class="box" fill="#e8f0fe" stroke="#0066cc"/>
  <text x="480" y="195" text-anchor="middle" class="t" fill="#004085">RateLimitingQueue</text>
  <text x="480" y="213" text-anchor="middle" class="l">AddRateLimited(key)</text>
  <text x="480" y="225" text-anchor="middle" class="l">指数退避 + 去重</text>
  <rect x="620" y="170" width="150" height="60" class="box" fill="#d4edda" stroke="#28a745"/>
  <text x="695" y="195" text-anchor="middle" class="t" fill="#155724">Controller Worker</text>
  <text x="695" y="213" text-anchor="middle" class="l">Get → Process(syncHandler)</text>
  <text x="695" y="225" text-anchor="middle" class="l">→ Done()/Forget()/Requeue</text>
  <line x1="480" y1="110" x2="420" y2="160" stroke="#e6a700" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr)"/>
  <line x1="330" y1="200" x2="400" y2="200" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="365" y="193" text-anchor="middle" font-size="9" fill="#4a6fa5">Enqueue key</text>
  <line x1="560" y1="200" x2="620" y2="200" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="590" y="193" text-anchor="middle" font-size="9" fill="#4a6fa5">Worker 消费</text>
  <path d="M700,230 L700,310 L150,310 L150,240 L200,230" stroke="#28a745" stroke-width="1.5" fill="none" stroke-dasharray="5" marker-end="url(#arr)"/>
  <text x="400" y="325" text-anchor="middle" class="l">Reconcile Loop:处理成功→Forget;失败→AddRateLimited 重试回队列;冲突→重 Get</text>
  <rect x="50" y="260" width="130" height="50" class="box" fill="#f5f5f5" stroke="#aaa"/>
  <text x="115" y="282" text-anchor="middle" class="t">Write-back</text>
  <text x="115" y="299" text-anchor="middle" class="l">更新对象→API Server→</text>
  <line x1="130" y1="80" x2="90" y2="260" stroke="#aaa" stroke-width="1" stroke-dasharray="3"/>
  <rect x="250" y="260" width="300" height="90" rx="8" fill="#fff8e1" stroke="#e6a700" stroke-width="1"/>
  <text x="400" y="280" text-anchor="middle" class="t" fill="#856404">关键点</text>
  <text x="270" y="298" class="l">1. Reflector 通过 Watch 接收事件,写入 DeltaFIFO(per-key 去重)</text>
  <text x="270" y="315" class="l">2. Pop 事件→更新 Indexer 本地缓存→调用注册的 Resource Event Handlers</text>
  <text x="270" y="332" class="l">3. Handlers 提取 key(namespace/name)放入 RateLimitingQueue</text>
  <text x="270" y="346" class="l">4. Worker 并发取 key,通过 Lister 查缓存执行业务 Reconcile 逻辑</text>
</svg>