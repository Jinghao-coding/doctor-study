<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a6fa5"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#28a745"/></marker>
    <style>.t{font-size:12px;font-weight:600}.l{font-size:10px;fill:#444}</style>
  </defs>
  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">K8s Pod 网络数据包路径 (同节点 / 跨节点)</text>
  <rect x="50" y="50" width="180" height="280" rx="10" fill="#e8f5e9" stroke="#28a745" stroke-width="2"/>
  <text x="140" y="72" text-anchor="middle" class="t" fill="#155724">Node 1</text>
  <rect x="70" y="90" width="65" height="50" rx="5" fill="#fff" stroke="#333"/>
  <text x="102" y="110" text-anchor="middle" class="t">Pod A</text>
  <text x="102" y="125" text-anchor="middle" class="l">netns:eth0</text>
  <text x="102" y="136" text-anchor="middle" class="l">10.1.1.5</text>
  <rect x="70" y="230" width="65" height="50" rx="5" fill="#fff" stroke="#333" opacity="0.5"/>
  <text x="102" y="260" text-anchor="middle" class="l">(同节点其他 Pod)</text>
  <rect x="155" y="90" width="65" height="50" rx="5" fill="#f8f9fa" stroke="#999" stroke-dasharray="3"/>
  <text x="187" y="112" text-anchor="middle" class="l">veth pair</text>
  <text x="187" y="125" text-anchor="middle" class="l">(一端在 pod</text>
  <text x="187" y="136" text-anchor="middle" class="l">一端在 node)</text>
  <rect x="80" y="170" width="130" height="40" rx="5" fill="#e8f0fe" stroke="#0066cc"/>
  <text x="145" y="188" text-anchor="middle" class="t" fill="#004085">cni0 / bridge</text>
  <text x="145" y="203" text-anchor="middle" class="l">(Calico: 路由; Cilium: eBPF)</text>
  <rect x="80" y="230" width="130" height="40" rx="5" fill="#fff3cd" stroke="#e6a700"/>
  <text x="145" y="248" text-anchor="middle" class="t" fill="#856404">Node 路由表 / iptables/eBPF</text>
  <text x="145" y="263" text-anchor="middle" class="l">kube-proxy 处理 Service</text>
  <line x1="102" y1="140" x2="187" y2="155" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="187" y1="140" x2="145" y2="170" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="145" y1="210" x2="145" y2="230" stroke="#4a6fa5" stroke-width="1.5"/>
  <line x1="135" y1="250" x2="102" y2="230" stroke="#4a6fa5" stroke-width="1" stroke-dasharray="3"/>
  <rect x="320" y="50" width="180" height="280" rx="10" fill="#e8f5e9" stroke="#28a745" stroke-width="2"/>
  <text x="410" y="72" text-anchor="middle" class="t" fill="#155724">Node 2</text>
  <rect x="340" y="90" width="65" height="50" rx="5" fill="#fff" stroke="#333"/>
  <text x="372" y="110" text-anchor="middle" class="t">Pod B</text>
  <text x="372" y="125" text-anchor="middle" class="l">netns:eth0</text>
  <text x="372" y="136" text-anchor="middle" class="l">10.1.2.8</text>
  <rect x="425" y="90" width="65" height="50" rx="5" fill="#f8f9fa" stroke="#999" stroke-dasharray="3"/>
  <text x="457" y="112" text-anchor="middle" class="l">veth pair</text>
  <rect x="350" y="170" width="130" height="40" rx="5" fill="#e8f0fe" stroke="#0066cc"/>
  <text x="415" y="188" text-anchor="middle" class="t" fill="#004085">cni0 / bridge</text>
  <rect x="350" y="230" width="130" height="40" rx="5" fill="#fff3cd" stroke="#e6a700"/>
  <text x="415" y="248" text-anchor="middle" class="t" fill="#856404">路由 / iptables/eBPF</text>
  <line x1="372" y1="140" x2="457" y2="155" stroke="#4a6fa5" stroke-width="1.5"/>
  <line x1="457" y1="140" x2="415" y2="170" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="570" y="100" width="200" height="120" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  <text x="670" y="122" text-anchor="middle" class="t">Underlay Network</text>
  <text x="670" y="142" text-anchor="middle" class="l">Calico BGP: 直接路由(无封装)</text>
  <text x="670" y="158" text-anchor="middle" class="l">Calico IPIP: IP-in-IP 封装</text>
  <text x="670" y="174" text-anchor="middle" class="l">Flannel VXLAN: UDP 封装</text>
  <text x="670" y="190" text-anchor="middle" class="l">Cilium: 直接路由 + eBPF</text>
  <text x="670" y="208" text-anchor="middle" class="l">物理网络 / VPC /  overlay</text>
  <line x1="210" y1="250" x2="350" y2="250" stroke="#28a745" stroke-width="2" marker-end="url(#b)"/>
  <path d="M280,250 L280,200 L415,200 L415,210" stroke="#28a745" stroke-width="2" fill="none" marker-end="url(#b)" stroke-dasharray="4"/>
  <text x="280" y="275" text-anchor="middle" class="l" fill="#28a745">跨节点:路由 → underlay → 对端</text>
  <rect x="50" y="300" width="720" height="40" rx="5" fill="#fff3cd" stroke="#e6a700"/>
  <text x="60" y="318" class="l" fill="#856404">同节点:Pod A → veth → cni0/bridge → 路由 → veth → Pod B (不经过物理网络)</text>
  <text x="60" y="333" class="l" fill="#856404">跨节点:Pod A → veth → cni0 → Node 路由表 (查 PodCIDR) → 物理网卡 → Underlay → Node 2 路由 → veth → Pod B</text>
</svg>