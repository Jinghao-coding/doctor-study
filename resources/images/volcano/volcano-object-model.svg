<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Volcano object model</title>
  <desc id="desc">Relationship between Queue, VolcanoJob, PodGroup, Tasks and Pods.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.8;rx:16}
      .queue{fill:#eff6ff;stroke:#3b82f6}
      .job{fill:#f5f3ff;stroke:#8b5cf6}
      .pg{fill:#ecfdf5;stroke:#10b981}
      .pod{fill:#fffbeb;stroke:#f59e0b}
      .sched{fill:#f8fafc;stroke:#64748b}
      .title{font:800 24px Inter,Arial,sans-serif;fill:#0f172a}
      .label{font:700 16px Inter,Arial,sans-serif;fill:#111827}
      .small{font:13px Inter,Arial,sans-serif;fill:#475569}
      .arrow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="42" y="48" class="title">Volcano 对象关系：谁管资源，谁管 Gang，谁管作业</text>

  <rect x="60" y="105" width="250" height="130" class="box queue"/>
  <text x="86" y="140" class="label">Queue</text>
  <text x="86" y="168" class="small">租户 / 团队资源池</text>
  <text x="86" y="190" class="small">capability · deserved</text>
  <text x="86" y="212" class="small">weight · reclaimable</text>

  <rect x="430" y="90" width="270" height="160" class="box job"/>
  <text x="456" y="126" class="label">VolcanoJob</text>
  <text x="456" y="154" class="small">用户提交的批作业</text>
  <text x="456" y="176" class="small">tasks: ps / worker / master</text>
  <text x="456" y="198" class="small">policies: PodFailed → RestartJob</text>
  <text x="456" y="220" class="small">plugins: ssh / svc / env</text>

  <rect x="805" y="105" width="250" height="130" class="box pg"/>
  <text x="831" y="140" class="label">PodGroup</text>
  <text x="831" y="168" class="small">Gang 调度单元</text>
  <text x="831" y="190" class="small">minMember · minResources</text>
  <text x="831" y="212" class="small">priorityClassName · queue</text>

  <rect x="430" y="340" width="270" height="140" class="box sched"/>
  <text x="456" y="376" class="label">Volcano Scheduler</text>
  <text x="456" y="404" class="small">Action: enqueue / allocate</text>
  <text x="456" y="426" class="small">Plugin: gang / drf / priority</text>
  <text x="456" y="448" class="small">Session: Jobs / Queues / Nodes</text>

  <rect x="80" y="365" width="190" height="86" class="box pod"/>
  <text x="106" y="398" class="label">TaskInfo</text>
  <text x="106" y="424" class="small">scheduler 内部对象</text>
  <text x="106" y="444" class="small">Pod wrapper</text>

  <rect x="820" y="365" width="190" height="86" class="box pod"/>
  <text x="846" y="398" class="label">Pod</text>
  <text x="846" y="424" class="small">真实 K8s Pod</text>
  <text x="846" y="444" class="small">最终绑定到 Node</text>

  <path class="arrow" d="M310 170 C360 170 380 170 430 170"/>
  <text x="332" y="154" class="small">belongs to</text>
  <path class="arrow" d="M700 170 C750 170 760 170 805 170"/>
  <text x="722" y="154" class="small">creates / owns</text>
  <path class="arrow" d="M565 250 C565 285 565 305 565 340"/>
  <text x="585" y="302" class="small">schedule as a unit</text>
  <path class="arrow" d="M430 410 C365 410 330 410 270 410"/>
  <text x="304" y="392" class="small">internal wrapper</text>
  <path class="arrow" d="M700 410 C755 410 775 410 820 410"/>
  <text x="725" y="392" class="small">bind</text>
  <path class="soft" d="M930 235 C930 290 920 320 915 365"/>
  <text x="944" y="306" class="small">contains Pods</text>

  <text x="74" y="552" class="label">记忆方式</text>
  <text x="74" y="580" class="small">Queue = 资源池；VolcanoJob = 用户作业；PodGroup = Gang 原子单元；TaskInfo = Pod 的调度器内部包装。</text>
</svg>
