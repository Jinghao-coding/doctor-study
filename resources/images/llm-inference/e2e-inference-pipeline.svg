<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#3182ce"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#38a169"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dd6b20"/>
    </marker>
    <marker id="arrPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#805ad5"/>
    </marker>
    <marker id="arrTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#319795"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a0aec0"/>
    </marker>
  </defs>

  <!-- ====== TITLE ====== -->
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a202c">LLM 端到端推理链路：从请求到 Token 流式输出</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#718096">自回归推理 = 先 Prefill 并行处理完整 Prompt（compute-bound） → 再 Decode 逐 token 自回归生成（memory-bound）</text>

  <!-- ====== ROW 1: Pre-GPU stages ====== -->

  <!-- Stage 1: Request Wrapping (blue) -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="155" height="100" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
    <rect x="30" y="70" width="155" height="28" rx="10" fill="#3182ce"/>
    <path d="M30 90 h155 v8 h-155z" fill="#3182ce"/>
    <text x="107" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">① 请求封装</text>
  </g>
  <g font-size="10" fill="#2d3748">
    <text x="44" y="118">• 组装 messages</text>
    <text x="44" y="134">• 采样参数：</text>
    <text x="50" y="148" font-size="9" fill="#4a5568">  temperature / top_p</text>
    <text x="50" y="161" font-size="9" fill="#4a5568">  max_tokens / stop</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="185" y1="120" x2="210" y2="120" stroke="#3182ce" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- Stage 2: Tokenization (blue) -->
  <g filter="url(#shadow)">
    <rect x="215" y="70" width="155" height="100" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
    <rect x="215" y="70" width="155" height="28" rx="10" fill="#3182ce"/>
    <path d="M215 90 h155 v8 h-155z" fill="#3182ce"/>
    <text x="292" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">② Tokenization</text>
  </g>
  <g font-size="10" fill="#2d3748">
    <text x="229" y="118">• BPE / tiktoken 分词</text>
    <text x="229" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">"你好" → [123,456,…]</text>
    <text x="229" y="153">• 添加 BOS/EOS、</text>
    <text x="233" y="166">  chat template 标记</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="370" y1="120" x2="395" y2="120" stroke="#805ad5" stroke-width="2" marker-end="url(#arrPurple)"/>

  <!-- Stage 3: Scheduling (purple) -->
  <g filter="url(#shadow)">
    <rect x="400" y="70" width="180" height="100" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5"/>
    <rect x="400" y="70" width="180" height="28" rx="10" fill="#805ad5"/>
    <path d="M400 90 h180 v8 h-180z" fill="#805ad5"/>
    <text x="490" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">③ 推理调度</text>
  </g>
  <g font-size="10" fill="#2d3748">
    <text x="414" y="118">• 请求排队 / 优先级</text>
    <text x="414" y="133">• <tspan font-weight="700" fill="#805ad5">Continuous Batching</tspan></text>
    <text x="418" y="146" font-size="9">  iteration-level 动态组 batch</text>
    <text x="414" y="160">• KV Cache 预算 / Chunked Prefill</text>
  </g>

  <!-- Arrow from Scheduler DOWN to GPU (main flow) -->
  <path d="M490,170 L490,195" stroke="#805ad5" stroke-width="2.5" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="430" y="176" width="120" height="16" rx="3" fill="#faf5ff"/>
  <text x="490" y="188" text-anchor="middle" font-size="9" font-weight="600" fill="#805ad5">batch input_ids</text>

  <!-- Waiting queue (dashed side box, NOT in main flow) -->
  <g filter="url(#shadow)">
    <rect x="640" y="70" width="130" height="100" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="705" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568">⏳ 等待队列</text>
    <text x="705" y="118" text-anchor="middle" font-size="9" fill="#718096">waiting queue</text>
    <text x="705" y="138" text-anchor="middle" font-size="9" fill="#a0aec0">多请求等待 Scheduler</text>
    <text x="705" y="151" text-anchor="middle" font-size="9" fill="#a0aec0">决定哪些进入 batch</text>
  </g>
  <!-- Dashed line from scheduler to waiting queue (manages relationship) -->
  <path d="M580,110 Q610,110 635,110" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrGray)"/>

  <!-- ====== ROW 2: GPU COMPUTATION ====== -->
  <rect x="30" y="205" width="940" height="310" rx="14" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- GPU header bar (dark, only for the title) -->
  <rect x="30" y="205" width="940" height="38" rx="14" fill="#2d3748"/>
  <path d="M30 231 h940 v12 h-940z" fill="#2d3748"/>
  <text x="54" y="229" font-size="14" font-weight="700" fill="#fff">🖥  GPU 计算：Transformer Layers × N</text>
  <text x="54" y="246" font-size="10" fill="#718096">Embedding → RoPE → 多层 [Self-Attention + FFN + RMSNorm + 残差] → LM Head → Logits</text>

  <!-- ===== Prefill (green) ===== -->
  <g filter="url(#shadow)">
    <rect x="55" y="260" width="425" height="200" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
    <rect x="55" y="260" width="425" height="32" rx="10" fill="#38a169"/>
    <path d="M55 284 h425 v8 h-425z" fill="#38a169"/>
    <text x="267" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">④ Prefill 阶段（Prompt Processing）</text>
  </g>

  <g font-size="10.5" fill="#2d3748">
    <text x="72" y="316" font-weight="700" fill="#276749" font-size="12">核心操作</text>
    <text x="72" y="334">• 一次性并行处理 <tspan font-weight="700">所有 prompt tokens</tspan></text>
    <text x="72" y="351">• 为每个位置计算 K/V 向量，<tspan font-weight="700">写入 KV Cache</tspan></text>
    <text x="72" y="368">• 大矩阵乘法 (GEMM)，GPU 算力吃满</text>

    <text x="72" y="392" font-weight="700" fill="#276749" font-size="12">瓶颈属性</text>
    <text x="72" y="409">• <tspan font-weight="700" fill="#276749">Compute-bound</tspan>：算术强度高</text>
    <text x="72" y="426">• 关键指标：<tspan font-weight="700">TTFT</tspan>（Time To First Token）</text>
    <text x="72" y="443">• FlashAttention 降低 HBM 访问量</text>
  </g>

  <!-- Prompt tokens visual (inside Prefill, top-right area) -->
  <g transform="translate(278, 310)">
    <rect x="0"   y="0" width="24" height="22" rx="4" fill="#38a169"/>
    <text x="12"  y="15" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">SYS</text>
    <rect x="28"  y="0" width="24" height="22" rx="4" fill="#48bb78"/>
    <text x="40"  y="15" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">U1</text>
    <rect x="56"  y="0" width="24" height="22" rx="4" fill="#48bb78"/>
    <text x="68"  y="15" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">U2</text>
    <rect x="84"  y="0" width="24" height="22" rx="4" fill="#68d391"/>
    <text x="96"  y="15" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">U3</text>
    <rect x="112" y="0" width="24" height="22" rx="4" fill="#68d391"/>
    <text x="124" y="15" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">U4</text>
    <text x="144" y="16" font-size="14" fill="#276749" font-weight="700">…</text>
    <rect x="162" y="0" width="24" height="22" rx="4" fill="#fbd38d" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="174" y="15" text-anchor="middle" font-size="10" fill="#7b341e" font-weight="700">?</text>
  </g>

  <!-- Arrow Prefill → Decode (labeled badge) -->
  <line x1="480" y1="360" x2="518" y2="360" stroke="#dd6b20" stroke-width="3" marker-end="url(#arrOrange)"/>
  <rect x="452" y="340" width="80" height="18" rx="9" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.2"/>
  <text x="492" y="353" text-anchor="middle" font-size="10" font-weight="700" fill="#dd6b20">首 token 后</text>

  <!-- ===== Decode (orange) ===== -->
  <g filter="url(#shadow)">
    <rect x="525" y="260" width="425" height="200" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
    <rect x="525" y="260" width="425" height="32" rx="10" fill="#dd6b20"/>
    <path d="M525 284 h425 v8 h-425z" fill="#dd6b20"/>
    <text x="737" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">⑤ Decode 阶段（自回归生成循环）</text>
  </g>

  <g font-size="10.5" fill="#2d3748">
    <text x="542" y="316" font-weight="700" fill="#7b341e" font-size="12">核心操作</text>
    <text x="542" y="334">• 每步 <tspan font-weight="700">只输入 1 个新 token</tspan>（刚生成的）</text>
    <text x="542" y="351">• Q 来自新 token，K/V 从 KV Cache 读取</text>
    <text x="542" y="368">• 新 token K/V 追加到 Cache，继续循环</text>

    <text x="542" y="392" font-weight="700" fill="#7b341e" font-size="12">瓶颈属性</text>
    <text x="542" y="409">• <tspan font-weight="700" fill="#7b341e">Memory-bound</tspan>：每步读整个 KV Cache</text>
    <text x="542" y="426">• 关键指标：<tspan font-weight="700">TPOT</tspan>（Time Per Output Token）</text>
    <text x="542" y="443">• PagedAttention 减少碎片、提升共享</text>
  </g>

  <!-- Autoregressive loop visual (inside Decode, top-right, COMPACT) -->
  <g transform="translate(800, 308)">
    <rect x="0"  y="0" width="20" height="20" rx="3" fill="#9ae6b4" opacity="0.7"/>
    <text x="10" y="14" text-anchor="middle" font-size="7" fill="#276749" font-weight="700">KV</text>
    <rect x="24" y="0" width="20" height="20" rx="3" fill="#9ae6b4" opacity="0.7"/>
    <text x="34" y="14" text-anchor="middle" font-size="7" fill="#276749" font-weight="700">KV</text>
    <text x="52" y="14" font-size="12" fill="#7b341e" font-weight="700">…</text>
    <rect x="64" y="0" width="20" height="20" rx="3" fill="#dd6b20"/>
    <text x="74" y="14" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">新</text>
    <!-- compact loop arrow above the tokens -->
    <path d="M74,-4 Q98,-16 98,0 Q98,18 82,20" stroke="#c05621" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
    <polygon points="82,20 79,14 85,14" fill="#c05621"/>
    <text x="105" y="5" font-size="8.5" fill="#7b341e" font-weight="600">循环</text>
  </g>

  <!-- KV Cache growth bar (inside GPU area, bottom) -->
  <rect x="180" y="470" width="540" height="8" rx="4" fill="#fefcbf" stroke="#d69e2e" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="450" y="494" text-anchor="middle" font-size="9.5" fill="#975a16" font-weight="600">KV Cache 在 HBM 中持续增长：Prefill 初始化 → Decode 每步追加新 K/V → 请求完成后释放</text>

  <!-- ====== ROW 3: Output stage ====== -->

  <!-- Arrow from GPU down to output -->
  <path d="M600,515 L600,540 Q600,550 590,557 L560,565" stroke="#319795" stroke-width="2" fill="none" marker-end="url(#arrTeal)"/>

  <!-- Stage 6: Output (teal) -->
  <g filter="url(#shadow)">
    <rect x="380" y="570" width="240" height="70" rx="10" fill="#e6fffa" stroke="#319795" stroke-width="1.5"/>
    <rect x="380" y="570" width="240" height="28" rx="10" fill="#319795"/>
    <path d="M380 590 h240 v8 h-240z" fill="#319795"/>
    <text x="500" y="589" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">⑥ 采样 + Detokenize + 流式返回</text>
  </g>
  <g font-size="10" fill="#2d3748">
    <text x="394" y="614">• Logits → Sampling（greedy/top-k/top-p）</text>
    <text x="394" y="629">• Detokenize：token ID → 文本</text>
  </g>

  <!-- Stream output annotation (right of output box) -->
  <text x="635" y="595" font-size="10" fill="#319795" font-weight="600">→ SSE / WebSocket</text>
  <text x="639" y="610" font-size="10" fill="#319795" font-weight="600">  逐 token 流式输出</text>
  <text x="639" y="625" font-size="9" fill="#718096">→ 用户边生成边看到</text>

  <!-- ====== BOTTOM: SLO metrics bar ====== -->
  <rect x="30" y="660" width="940" height="30" rx="8" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
  <g font-size="10.5" fill="#4a5568">
    <text x="52" y="680" font-weight="700" fill="#1a202c">核心 SLO 指标：</text>
    <text x="160" y="680"><tspan fill="#276749" font-weight="700">TTFT</tspan> <tspan fill="#4a5568">首 token 延迟（Prefill 决定）</tspan></text>
    <text x="400" y="680"><tspan fill="#7b341e" font-weight="700">TPOT</tspan> <tspan fill="#4a5568">单 token 延迟（Decode 决定）</tspan></text>
    <text x="630" y="680"><tspan fill="#2b6cb0" font-weight="700">Throughput</tspan> <tspan fill="#4a5568">tokens/s（Batching 决定）</tspan></text>
    <text x="855" y="680"><tspan fill="#805ad5" font-weight="700">Latency</tspan> <tspan fill="#4a5568">P50/P95/P99</tspan></text>
  </g>
</svg>
