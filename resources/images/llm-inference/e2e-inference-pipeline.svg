<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="reqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="tokGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299e1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4299e1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="schedGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9f7aea" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9f7aea" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="prefillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48bb78" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#48bb78" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="decodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ed8936" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ed8936" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38b2ac" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38b2ac" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gpuBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="kvCacheGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf089" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f6e05e" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3182ce"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38a169"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dd6b20"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#805ad5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">LLM 端到端推理链路：从请求到 Token 流式输出</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#718096">自回归推理 = 先 Prefill 并行读完整 Prompt（compute-bound）→ 再 Decode 逐 token 生成（memory-bound）</text>

  <!-- Stage 1: Request Wrapping -->
  <g filter="url(#softShadow)">
    <rect x="20" y="65" width="135" height="90" rx="10" fill="url(#reqGrad)" stroke="#63b3ed" stroke-width="1.5"/>
    <rect x="20" y="65" width="135" height="26" rx="10" fill="#63b3ed"/>
    <rect x="20" y="81" width="135" height="10" fill="#63b3ed"/>
    <text x="87" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="white">① 请求封装</text>
  </g>
  <g font-size="9.5" fill="#2d3748">
    <text x="34" y="108">• 组织 system/user/</text>
    <text x="34" y="122">  assistant messages</text>
    <text x="34" y="138">• generation params:</text>
    <text x="38" y="150">  temperature, top_p,</text>
    <text x="38" y="142" fill="#718096" font-size="8">max_tokens, stop</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="155" y1="110" x2="175" y2="110" stroke="#3182ce" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Stage 2: Tokenization -->
  <g filter="url(#softShadow)">
    <rect x="180" y="65" width="130" height="90" rx="10" fill="url(#tokGrad)" stroke="#4299e1" stroke-width="1.5"/>
    <rect x="180" y="65" width="130" height="26" rx="10" fill="#4299e1"/>
    <rect x="180" y="81" width="130" height="10" fill="#4299e1"/>
    <text x="245" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="white">② Tokenization</text>
  </g>
  <g font-size="9.5" fill="#2d3748">
    <text x="193" y="108">• BPE / tiktoken 分词</text>
    <text x="193" y="122">"你好" → [123, 456, ...]</text>
    <text x="193" y="138">• 添加 BOS/EOS、</text>
    <text x="193" y="150">  chat template 标记</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="310" y1="110" x2="340" y2="110" stroke="#805ad5" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- Stage 3: Scheduler / Continuous Batching -->
  <g filter="url(#softShadow)">
    <rect x="345" y="60" width="155" height="100" rx="10" fill="url(#schedGrad)" stroke="#9f7aea" stroke-width="1.5"/>
    <rect x="345" y="60" width="155" height="26" rx="10" fill="#9f7aea"/>
    <rect x="345" y="76" width="155" height="10" fill="#9f7aea"/>
    <text x="422" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="white">③ 推理调度</text>
  </g>
  <g font-size="9" fill="#2d3748">
    <text x="358" y="105">• 请求排队 / 优先级</text>
    <text x="358" y="118">• <tspan font-weight="700" fill="#805ad5">Continuous Batching</tspan>：</text>
    <text x="362" y="130">  iteration-level 动态组 batch</text>
    <text x="358" y="144">• KV Cache 内存预算</text>
    <text x="358" y="156">• Chunked Prefill 调度</text>
  </g>

  <!-- Arrow 3→GPU Box -->
  <line x1="422" y1="160" x2="422" y2="190" stroke="#2d3748" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="432" y="180" font-size="9" fill="#4a5568">input_ids 送 GPU</text>

  <!-- GPU Computation Box (dark background) -->
  <rect x="40" y="195" width="880" height="260" rx="14" fill="url(#gpuBox)" filter="url(#softShadow)"/>
  <text x="60" y="218" font-size="13" font-weight="700" fill="white">GPU 计算：Transformer Layers × N</text>
  <text x="60" y="234" font-size="10" fill="#a0aec0">Embedding → RoPE → 多层 [Multi-Head Self-Attention + FFN + RMSNorm + 残差] → LM Head → Logits</text>

  <!-- Prefill Phase Box inside GPU -->
  <g filter="url(#softShadow)">
    <rect x="70" y="250" width="370" height="180" rx="10" fill="url(#prefillGrad)" stroke="#48bb78" stroke-width="2"/>
    <rect x="70" y="250" width="370" height="30" rx="10" fill="#48bb78"/>
    <rect x="70" y="270" width="370" height="10" fill="#48bb78"/>
    <text x="255" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="white">④ Prefill 阶段（Prompt Processing）</text>
  </g>

  <g font-size="10" fill="#2d3748">
    <text x="88" y="300" font-weight="700" fill="#276749">核心操作</text>
    <text x="88" y="316">• 一次性并行处理 <tspan font-weight="700">所有 prompt tokens</tspan></text>
    <text x="88" y="331">• 为每个位置计算 K, V 向量，<tspan font-weight="700">写入 KV Cache</tspan></text>
    <text x="88" y="346">• 大矩阵乘法 (GEMM)，GPU 算力吃满</text>

    <text x="88" y="368" font-weight="700" fill="#276749">瓶颈属性</text>
    <text x="88" y="384">• <tspan font-weight="700" fill="#276749">Compute-bound</tspan>：算术强度高</text>
    <text x="88" y="398">• 关键指标：<tspan font-weight="700">TTFT</tspan> (Time To First Token)</text>
    <text x="88" y="412">• FlashAttention 降低 HBM 访问量</text>
  </g>

  <!-- Prompt tokens visualization -->
  <g transform="translate(270, 300)">
    <rect x="0" y="0" width="22" height="22" rx="3" fill="#48bb78" opacity="0.8"/>
    <text x="11" y="15" text-anchor="middle" font-size="8" fill="white" font-weight="600">SYS</text>
    <rect x="26" y="0" width="22" height="22" rx="3" fill="#68d391" opacity="0.8"/>
    <text x="37" y="15" text-anchor="middle" font-size="8" fill="white" font-weight="600">U1</text>
    <rect x="52" y="0" width="22" height="22" rx="3" fill="#68d391" opacity="0.8"/>
    <text x="63" y="15" text-anchor="middle" font-size="8" fill="white" font-weight="600">U2</text>
    <rect x="78" y="0" width="22" height="22" rx="3" fill="#9ae6b4" opacity="0.8"/>
    <text x="89" y="15" text-anchor="middle" font-size="8" fill="#276749" font-weight="600">U3</text>
    <rect x="104" y="0" width="22" height="22" rx="3" fill="#9ae6b4" opacity="0.8"/>
    <text x="115" y="15" text-anchor="middle" font-size="8" fill="#276749" font-weight="600">U4</text>
    <text x="136" y="15" font-size="10" fill="#276749" font-weight="600">…</text>
    <rect x="148" y="0" width="22" height="22" rx="3" fill="#fbd38d" opacity="0.6" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="159" y="15" text-anchor="middle" font-size="8" fill="#7b341e" font-weight="700">?</text>
    <text x="0" y="40" font-size="8" fill="#4a5568">Prompt tokens (并行) → 最后一个位置输出第一个 logit</text>
  </g>

  <!-- Arrow between Prefill and Decode -->
  <line x1="440" y1="340" x2="470" y2="340" stroke="#dd6b20" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="430" y="332" font-size="9" fill="#dd6b20" font-weight="600">首 token 后</text>

  <!-- Decode Phase Box inside GPU -->
  <g filter="url(#softShadow)">
    <rect x="480" y="250" width="420" height="180" rx="10" fill="url(#decodeGrad)" stroke="#ed8936" stroke-width="2"/>
    <rect x="480" y="250" width="420" height="30" rx="10" fill="#ed8936"/>
    <rect x="480" y="270" width="420" height="10" fill="#ed8936"/>
    <text x="690" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="white">⑤ Decode 阶段（自回归生成循环）</text>
  </g>

  <g font-size="10" fill="#2d3748">
    <text x="498" y="300" font-weight="700" fill="#7b341e">核心操作</text>
    <text x="498" y="316">• 每步 <tspan font-weight="700">只输入 1 个新 token</tspan>（刚生成的）</text>
    <text x="498" y="331">• Q 来自新 token，K/V 来自 KV Cache 读取</text>
    <text x="498" y="346">• 生成的新 token 追加到上下文，循环继续</text>

    <text x="498" y="368" font-weight="700" fill="#7b341e">瓶颈属性</text>
    <text x="498" y="384">• <tspan font-weight="700" fill="#7b341e">Memory-bound</tspan>：每步读整个 KV Cache</text>
    <text x="498" y="398">• 关键指标：<tspan font-weight="700">TPOT</tspan> (Time Per Output Token)</text>
    <text x="498" y="412">• PagedAttention 减少碎片 + 提升共享</text>
  </g>

  <!-- Autoregressive loop visualization -->
  <g transform="translate(750, 296)">
    <rect x="0" y="0" width="22" height="22" rx="3" fill="#68d391" opacity="0.5"/>
    <text x="11" y="15" text-anchor="middle" font-size="7" fill="#276749" font-weight="600">KV</text>
    <rect x="26" y="0" width="22" height="22" rx="3" fill="#68d391" opacity="0.5"/>
    <text x="37" y="15" text-anchor="middle" font-size="7" fill="#276749" font-weight="600">KV</text>
    <rect x="52" y="0" width="22" height="22" rx="3" fill="#68d391" opacity="0.5"/>
    <text x="63" y="15" text-anchor="middle" font-size="7" fill="#276749" font-weight="600">KV</text>
    <text x="80" y="15" font-size="10" fill="#4a5568">…</text>
    <rect x="92" y="0" width="22" height="22" rx="3" fill="#ed8936" stroke="#c05621" stroke-width="1.5"/>
    <text x="103" y="15" text-anchor="middle" font-size="8" fill="white" font-weight="700">新</text>
    <path d="M103,-8 Q130,-20 130,0 L130,8 Q130,28 103,22" stroke="#c05621" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
    <polygon points="103,22 100,16 106,16" fill="#c05621"/>
    <text x="140" y="6" font-size="8" fill="#7b341e" font-weight="600">循环:</text>
    <text x="140" y="18" font-size="8" fill="#7b341e">追加新 token</text>
    <text x="0" y="40" font-size="8" fill="#4a5568">历史 KV Cache（显存中） + 1 个新 token → 生成下一个 token</text>
  </g>

  <!-- KV Cache annotation between Prefill and Decode -->
  <rect x="200" y="435" width="500" height="8" rx="4" fill="url(#kvCacheGrad)" stroke="#d69e2e" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="450" y="450" text-anchor="middle" font-size="9" fill="#975a16" font-weight="600">
    ← KV Cache 在 HBM 中持续增长：Prefill 初始化 → Decode 每步追加新 K/V → 推理完成后释放 →
  </text>

  <!-- Stage 6: Output / Streaming -->
  <g filter="url(#softShadow)">
    <rect x="380" y="485" width="200" height="80" rx="10" fill="url(#outGrad)" stroke="#38b2ac" stroke-width="1.5"/>
    <rect x="380" y="485" width="200" height="26" rx="10" fill="#38b2ac"/>
    <rect x="380" y="501" width="200" height="10" fill="#38b2ac"/>
    <text x="480" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="white">⑥ 采样 + Detokenize + 流式返回</text>
  </g>
  <g font-size="9.5" fill="#2d3748">
    <text x="393" y="528">• Logits → Sampling（greedy/top-k/top-p）</text>
    <text x="393" y="543">• token ID → 文本（detokenize）</text>
    <text x="393" y="558">• SSE / WebSocket <tspan font-weight="700" fill="#2c7a7b">逐 token 流式输出</tspan></text>
  </g>

  <!-- Arrows from Decode down to Output -->
  <path d="M600,430 L600,455 Q600,465 590,472 L520,482" stroke="#319795" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M560,430 L560,470 L510,482" stroke="#319795" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>

  <!-- Bottom SLA metrics box -->
  <g>
    <rect x="40" y="580" width="880" height="30" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
    <g font-size="10" fill="#4a5568">
      <text x="60" y="599" font-weight="700" fill="#1a202c">核心 SLO 指标：</text>
      <text x="160" y="599"><tspan fill="#276749" font-weight="600">TTFT</tspan>（首 token 延迟，Prefill 决定）</text>
      <text x="370" y="599"><tspan fill="#7b341e" font-weight="600">TPOT</tspan>（单 token 生成延迟，Decode 决定）</text>
      <text x="600" y="599"><tspan fill="#2b6cb0" font-weight="600">Throughput</tspan>（tokens/s，Continuous Batching 决定）</text>
      <text x="820" y="599">Latency P50/P95/P99</text>
    </g>
  </g>
</svg>
