<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#333"/></marker>
    <style>.t{font-size:14px;font-weight:600}.l{font-size:11px;fill:#444}.s{font-size:10px;fill:#888}</style>
  </defs>
  <text x="390" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">TCP 滑动窗口 (Send Buffer)</text>
  <line x1="40" y1="100" x2="740" y2="100" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="750" y="104" class="l">字节序号 →</text>
  <rect x="100" y="75" width="100" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="150" y="105" text-anchor="middle" class="t" fill="#155724">已发送已 ACK</text>
  <rect x="200" y="75" width="80" height="50" rx="0" fill="#fff3cd" stroke="#e6a700" stroke-width="1.5"/>
  <text x="240" y="105" text-anchor="middle" class="t" fill="#856404">已发送未ACK</text>
  <rect x="280" y="75" width="120" height="50" rx="0" fill="#cce5ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="340" y="105" text-anchor="middle" class="t" fill="#004085">可用窗口 (可发)</text>
  <rect x="400" y="75" width="200" height="50" rx="5" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5"/>
  <text x="500" y="105" text-anchor="middle" class="l">不可发送 (rwnd/cwnd 限制)</text>
  <line x1="200" y1="65" x2="200" y2="135" stroke="#dc3545" stroke-width="2"/>
  <text x="200" y="58" text-anchor="middle" class="l" fill="#dc3545" font-weight="600">SND.UNA</text>
  <line x1="280" y1="65" x2="280" y2="135" stroke="#0066cc" stroke-width="2"/>
  <text x="280" y="58" text-anchor="middle" class="l" fill="#0066cc" font-weight="600">SND.NXT</text>
  <line x1="400" y1="65" x2="400" y2="135" stroke="#333" stroke-width="2"/>
  <text x="400" y="58" text-anchor="middle" class="l" font-weight="600">SND.UNA+swnd</text>
  <text x="150" y="135" text-anchor="middle" class="s">(左边界滑动)</text>
  <text x="340" y="145" text-anchor="middle" class="s">swnd = min(rwnd, cwnd)</text>
  <rect x="60" y="180" width="660" height="75" rx="8" fill="#f8f9fa" stroke="#ddd"/>
  <text x="80" y="200" class="t">指针说明:</text>
  <text x="80" y="218" class="l">• SND.UNA:已确认的最大序号 +1(窗口左边界)</text>
  <text x="80" y="235" class="l">• SND.NXT:下一个要发送的序号(可发窗口左边界)</text>
  <text x="380" y="218" class="l">• swnd = min(rwnd, cwnd):实际发送窗口大小</text>
  <text x="380" y="235" class="l">• 收到 ACK → SND.UNA 右移,窗口向右滑动</text>
</svg>