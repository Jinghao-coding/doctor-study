<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes container runtime chain</title>
  <desc id="desc">kubelet calls CRI, containerd CRI plugin manages sandbox, CNI, images, shim, runc, and Linux kernel namespaces and cgroups.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .blue{fill:#eff6ff;stroke:#3b82f6}
      .green{fill:#ecfdf5;stroke:#10b981}
      .purple{fill:#f5f3ff;stroke:#8b5cf6}
      .yellow{fill:#fffbeb;stroke:#f59e0b}
      .red{fill:#fef2f2;stroke:#ef4444}
      .title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#0f172a}
      .text{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#334155}
      .small{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#64748b}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="520"/>
  <text class="title" x="40" y="44">Pod 启动时的容器运行时链路</text>
  <text class="small" x="40" y="68">重点：Kubelet 是节点编排者；CRI 是接口；containerd 是高层 runtime；runc 创建 Linux 容器；shim 解耦 daemon 与容器进程。</text>

  <rect class="box blue" x="40" y="110" width="160" height="88" rx="8"/>
  <text class="title" x="76" y="144">kubelet</text>
  <text class="text" x="62" y="168">SyncPod / CRI client</text>
  <text class="small" x="62" y="188">节点生命周期编排</text>

  <rect class="box green" x="260" y="94" width="220" height="120" rx="8"/>
  <text class="title" x="300" y="128">containerd</text>
  <text class="text" x="288" y="154">CRI plugin</text>
  <text class="small" x="288" y="176">RuntimeService / ImageService</text>
  <text class="small" x="288" y="196">管理镜像、snapshot、container、task</text>

  <rect class="box yellow" x="540" y="74" width="220" height="78" rx="8"/>
  <text class="title" x="584" y="108">Pod sandbox</text>
  <text class="text" x="572" y="132">pause container 持有 namespace</text>

  <rect class="box yellow" x="540" y="184" width="220" height="78" rx="8"/>
  <text class="title" x="578" y="218">Image / Snapshot</text>
  <text class="text" x="572" y="242">content store + overlayfs rootfs</text>

  <rect class="box purple" x="820" y="110" width="220" height="88" rx="8"/>
  <text class="title" x="852" y="144">containerd-shim</text>
  <text class="text" x="852" y="168">托管 task / stdio / exit</text>
  <text class="small" x="852" y="188">daemon 重启时容器可继续运行</text>

  <rect class="box red" x="820" y="270" width="220" height="88" rx="8"/>
  <text class="title" x="902" y="304">runc</text>
  <text class="text" x="854" y="328">根据 OCI spec 创建容器</text>
  <text class="small" x="854" y="348">clone / setns / cgroup / mount</text>

  <rect class="box" x="540" y="330" width="220" height="88" rx="8"/>
  <text class="title" x="602" y="364">Linux kernel</text>
  <text class="text" x="570" y="388">namespace / cgroup / mount</text>
  <text class="small" x="570" y="408">容器隔离和资源限制最终落点</text>

  <rect class="box" x="260" y="292" width="220" height="88" rx="8"/>
  <text class="title" x="330" y="326">CNI</text>
  <text class="text" x="292" y="350">配置 Pod network namespace</text>
  <text class="small" x="292" y="370">分配 IP / veth / route / iptables</text>

  <path class="arrow" d="M200 154 H260"/>
  <text class="small" x="212" y="140">CRI gRPC</text>
  <path class="arrow" d="M480 132 H540"/>
  <text class="small" x="492" y="118">RunPodSandbox</text>
  <path class="dash" d="M540 124 C500 150 500 318 480 336"/>
  <text class="small" x="492" y="286">调用 CNI</text>
  <path class="arrow" d="M480 184 H540"/>
  <text class="small" x="492" y="174">PullImage</text>
  <path class="arrow" d="M760 154 H820"/>
  <text class="small" x="772" y="140">CreateTask</text>
  <path class="arrow" d="M930 198 V270"/>
  <text class="small" x="944" y="236">fork/exec</text>
  <path class="arrow" d="M820 318 C780 342 780 374 760 374"/>
  <text class="small" x="772" y="354">OCI spec</text>
  <path class="arrow" d="M650 330 V262"/>
  <text class="small" x="666" y="302">rootfs</text>
</svg>
