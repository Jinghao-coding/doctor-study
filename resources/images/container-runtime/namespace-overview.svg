<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="kernelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="nsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4299e1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4299e1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="c1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48bb78" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#48bb78" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="c2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ed8936" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ed8936" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Linux Namespace：同一内核下的"资源视图隔离"</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#718096">每个 Namespace 给其中的进程一份"私有拷贝"，进程以为自己独占了系统资源</text>

  <!-- Host / Global Resources Box -->
  <rect x="30" y="70" width="760" height="155" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="92" font-size="12" font-weight="700" fill="#c53030">宿主机（Host / Init PID Namespace）</text>
  <text x="50" y="108" font-size="10" fill="#e53e3e">进程直接看到全局真实资源，PID 从 1（systemd/init）开始</text>

  <!-- Global resource mini-cards -->
  <g font-size="10" fill="#2d3748">
    <rect x="50" y="120" width="135" height="44" rx="6" fill="white" stroke="#fc8181" stroke-width="1"/>
    <text x="117" y="138" text-anchor="middle" font-weight="600">PID 空间</text>
    <text x="117" y="154" text-anchor="middle" fill="#718096">1 (systemd) · 2 · 3 …</text>

    <rect x="200" y="120" width="135" height="44" rx="6" fill="white" stroke="#fc8181" stroke-width="1"/>
    <text x="267" y="138" text-anchor="middle" font-weight="600">Mount 挂载点</text>
    <text x="267" y="154" text-anchor="middle" fill="#718096">全局 /proc /sys /home …</text>

    <rect x="350" y="120" width="135" height="44" rx="6" fill="white" stroke="#fc8181" stroke-width="1"/>
    <text x="417" y="138" text-anchor="middle" font-weight="600">Network 栈</text>
    <text x="417" y="154" text-anchor="middle" fill="#718096">eth0 · 全局路由表 · iptables</text>

    <rect x="500" y="120" width="135" height="44" rx="6" fill="white" stroke="#fc8181" stroke-width="1"/>
    <text x="567" y="138" text-anchor="middle" font-weight="600">UTS hostname</text>
    <text x="567" y="154" text-anchor="middle" fill="#718096">host-prod-01</text>

    <rect x="650" y="120" width="130" height="44" rx="6" fill="white" stroke="#fc8181" stroke-width="1"/>
    <text x="715" y="138" text-anchor="middle" font-weight="600">IPC / User / Cgroup</text>
    <text x="715" y="154" text-anchor="middle" fill="#718096">全局共享内存 / UID 0…</text>
  </g>

  <text x="50" y="195" font-size="10" fill="#a0aec0">↕ 系统调用边界 —— clone(CLONE_NEW*) / unshare() / setns() 穿过这一层，进程拿到"私有视图"</text>

  <!-- Namespace abstraction layer (kernel) -->
  <rect x="30" y="220" width="760" height="50" rx="10" fill="url(#kernelGrad)" filter="url(#shadow)"/>
  <text x="410" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="white">Linux Kernel（所有容器共享同一个内核）</text>
  <text x="410" y="260" text-anchor="middle" font-size="10" fill="#a0aec0">Namespace 是内核的"全局资源包装器"：每种资源类型对应一张独立的 nsproxy 表</text>

  <!-- Syscalls arrows -->
  <g font-size="9" fill="#4a5568" text-anchor="middle">
    <rect x="140" y="200" width="120" height="18" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1"/>
    <text x="200" y="213" font-weight="600">clone(CLONE_NEWPID|...)</text>
    <rect x="400" y="200" width="80" height="18" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1"/>
    <text x="440" y="213" font-weight="600">unshare()</text>
    <rect x="580" y="200" width="80" height="18" rx="9" fill="#ebf8ff" stroke="#4299e1" stroke-width="1"/>
    <text x="620" y="213" font-weight="600">setns()</text>
  </g>

  <!-- Container A -->
  <rect x="60" y="295" width="320" height="195" rx="12" fill="url(#c1Grad)" stroke="#48bb78" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="295" width="320" height="32" rx="12" fill="#48bb78"/>
  <rect x="60" y="315" width="320" height="12" fill="#48bb78"/>
  <text x="220" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="white">Container A （容器 A）</text>
  <text x="220" y="345" text-anchor="middle" font-size="10" fill="#2f855a">拥有自己的 6+ 类 namespace，进程以为自己是独立机器</text>

  <!-- Container A resources -->
  <g font-size="10" fill="#2d3748">
    <rect x="78" y="358" width="135" height="40" rx="6" fill="white" stroke="#48bb78" stroke-width="1"/>
    <text x="145" y="375" text-anchor="middle" font-weight="600">PID = 1 (nginx)</text>
    <text x="145" y="390" text-anchor="middle" fill="#718096">看不到宿主机和 B 的进程</text>

    <rect x="228" y="358" width="135" height="40" rx="6" fill="white" stroke="#48bb78" stroke-width="1"/>
    <text x="295" y="375" text-anchor="middle" font-weight="600">Mount = / (overlayfs)</text>
    <text x="295" y="390" text-anchor="middle" fill="#718096">mount/umount 互不影响</text>

    <rect x="78" y="408" width="135" height="40" rx="6" fill="white" stroke="#48bb78" stroke-width="1"/>
    <text x="145" y="425" text-anchor="middle" font-weight="600">Net = eth0@if12</text>
    <text x="145" y="440" text-anchor="middle" fill="#718096">独立 IP/路由/端口</text>

    <rect x="228" y="408" width="135" height="40" rx="6" fill="white" stroke="#48bb78" stroke-width="1"/>
    <text x="295" y="425" text-anchor="middle" font-weight="600">UTS = container-a</text>
    <text x="295" y="440" text-anchor="middle" fill="#718096">hostname 独立</text>

    <rect x="78" y="456" width="285" height="26" rx="6" fill="#f0fff4" stroke="#48bb78" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="220" y="473" text-anchor="middle" font-size="9" fill="#276749">IPC 隔离 · User(UID 映射) · Cgroup 视图隔离</text>
  </g>

  <!-- Container B -->
  <rect x="440" y="295" width="320" height="195" rx="12" fill="url(#c2Grad)" stroke="#ed8936" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="295" width="320" height="32" rx="12" fill="#ed8936"/>
  <rect x="440" y="315" width="320" height="12" fill="#ed8936"/>
  <text x="600" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="white">Container B （容器 B）</text>
  <text x="600" y="345" text-anchor="middle" font-size="10" fill="#c05621">另一个独立的 namespace 集合，彼此看不到对方</text>

  <g font-size="10" fill="#2d3748">
    <rect x="458" y="358" width="135" height="40" rx="6" fill="white" stroke="#ed8936" stroke-width="1"/>
    <text x="525" y="375" text-anchor="middle" font-weight="600">PID = 1 (python app)</text>
    <text x="525" y="390" text-anchor="middle" fill="#718096">同样从 1 开始编号</text>

    <rect x="608" y="358" width="135" height="40" rx="6" fill="white" stroke="#ed8936" stroke-width="1"/>
    <text x="675" y="375" text-anchor="middle" font-weight="600">Mount = / (overlayfs)</text>
    <text x="675" y="390" text-anchor="middle" fill="#718096">自己的镜像 + 可写层</text>

    <rect x="458" y="408" width="135" height="40" rx="6" fill="white" stroke="#ed8936" stroke-width="1"/>
    <text x="525" y="425" text-anchor="middle" font-weight="600">Net = eth0@if15</text>
    <text x="525" y="440" text-anchor="middle" fill="#718096">可以和 A 同端口不冲突</text>

    <rect x="608" y="408" width="135" height="40" rx="6" fill="white" stroke="#ed8936" stroke-width="1"/>
    <text x="675" y="425" text-anchor="middle" font-weight="600">UTS = container-b</text>
    <text x="675" y="440" text-anchor="middle" fill="#718096">hostname 独立</text>

    <rect x="458" y="456" width="285" height="26" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="600" y="473" text-anchor="middle" font-size="9" fill="#7b341e">IPC 隔离 · User(UID 映射) · Cgroup 视图隔离</text>
  </g>

  <!-- Dashed lines from kernel to containers indicating the views -->
  <line x1="220" y1="270" x2="220" y2="295" stroke="#4299e1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="600" y1="270" x2="600" y2="295" stroke="#4299e1" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
