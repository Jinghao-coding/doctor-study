<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-weak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#f8fafc" rx="8"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">shared_ptr 控制块（Control Block）结构</text>

  <!-- shared_ptr 1 -->
  <rect x="40" y="70" width="160" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">shared_ptr (sp1)</text>
  <line x1="55" y1="105" x2="185" y2="105" stroke="#93c5fd" stroke-width="1"/>
  <text x="120" y="125" text-anchor="middle" font-size="12" fill="#1e3a8a">ptr → T 对象</text>
  <text x="120" y="142" text-anchor="middle" font-size="12" fill="#1e3a8a">ctrl → 控制块</text>

  <!-- shared_ptr 2 (copy) -->
  <rect x="440" y="70" width="160" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">shared_ptr (sp2)</text>
  <line x1="455" y1="105" x2="585" y2="105" stroke="#93c5fd" stroke-width="1"/>
  <text x="520" y="125" text-anchor="middle" font-size="12" fill="#1e3a8a">ptr → T 对象</text>
  <text x="520" y="142" text-anchor="middle" font-size="12" fill="#1e3a8a">ctrl → 控制块</text>

  <!-- weak_ptr -->
  <rect x="240" y="70" width="160" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">weak_ptr (wp)</text>
  <line x1="255" y1="105" x2="385" y2="105" stroke="#fcd34d" stroke-width="1"/>
  <text x="320" y="125" text-anchor="middle" font-size="12" fill="#78350f">ptr → T 对象（可能空悬）</text>
  <text x="320" y="142" text-anchor="middle" font-size="12" fill="#78350f">ctrl → 控制块</text>

  <!-- Control Block -->
  <rect x="140" y="220" width="360" height="130" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="320" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">控制块（Control Block, 堆分配）</text>
  <line x1="155" y1="255" x2="485" y2="255" stroke="#cbd5e1" stroke-width="1"/>

  <!-- strong ref count -->
  <rect x="160" y="265" width="150" height="32" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="235" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">strong_refcount = 2</text>

  <!-- weak ref count -->
  <rect x="330" y="265" width="150" height="32" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="405" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">weak_refcount = 1</text>

  <!-- other fields -->
  <rect x="160" y="305" width="320" height="32" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="320" y="326" text-anchor="middle" font-size="11" fill="#334155">deleter / allocator / 其他元数据</text>

  <!-- T Object -->
  <rect x="255" y="180" width="130" height="30" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="320" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#831843">托管对象 T</text>

  <!-- arrows from shared_ptrs to control block -->
  <path d="M120,150 C120,180 180,210 230,220" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M520,150 C520,180 460,210 410,220" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M320,150 L320,218" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrow-weak)"/>

  <!-- arrows from shared_ptrs to T object -->
  <path d="M120,150 C120,165 200,175 253,193" stroke="#3b82f6" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M520,150 C520,165 440,175 387,193" stroke="#3b82f6" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- arrow from control block to T (owns) -->
  <path d="M320,220 L320,212" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <text x="320" y="368" text-anchor="middle" font-size="10" fill="#64748b">strong_refcount 归零时析构 T；weak_refcount 归零时释放控制块本身</text>
</svg>
