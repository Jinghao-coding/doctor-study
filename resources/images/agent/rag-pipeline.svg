  <text x="335" y="228" text-anchor="middle" class="t" fill="#155724">Hybrid Retrieval</text>
  <text x="335" y="242" text-anchor="middle" class="l">Dense + BM25 + RRF</text>
  <text x="335" y="255" text-anchor="middle" class="l">+ Graph/多跳</text>
  <rect x="415" y="210" width="100" height="50" class="box" fill="#e8f0fe" stroke="#0066cc"/>
