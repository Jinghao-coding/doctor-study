  <rect x="145" y="210" width="110" height="50" class="box" fill="#fff3cd" stroke="#e6a700"/>
  <text x="200" y="230" text-anchor="middle" class="t" fill="#856404">Query Transform</text>
  <text x="200" y="245" text-anchor="middle" class="l">Rewrite/Multi-Query/HyDE</text>
