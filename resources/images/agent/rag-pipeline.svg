<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4a6fa5"/></marker>
    <style>.t{font-size:12px;font-weight:600}.l{font-size:10px;fill:#444}.s{font-size:9px;fill:#888}.box{rx:8;ry:8;stroke-width:1.5}</style>
  </defs>
  <text x="400" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Advanced RAG Pipeline:索引管线 + 查询管线</text>
  <rect x="20" y="45" width="760" height="110" rx="10" fill="#f0f7ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="400" y="62" text-anchor="middle" class="t" fill="#004085">索引阶段 (Indexing,离线)</text>
  <rect x="35" y="75" width="100" height="50" class="box" fill="#fff" stroke="#0066cc"/>
  <text x="85" y="95" text-anchor="middle" class="t">Documents</text>
  <text x="85" y="110" text-anchor="middle" class="l">PDF/网页/文档</text>
  <rect x="160" y="75" width="110" height="50" class="box" fill="#e8f0fe" stroke="#0066cc"/>
  <text x="215" y="95" text-anchor="middle" class="t" fill="#004085">Chunking</text>
  <text x="215" y="110" text-anchor="middle" class="l">语义/递归/Parent-Doc</text>
  <rect x="295" y="75" width="110" height="50" class="box" fill="#d4edda" stroke="#28a745"/>
