  <text x="730" y="110" text-anchor="middle" class="l">HNSW/IVF</text>
  <line x1="135" y1="100" x2="160" y2="100" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="270" y1="100" x2="295" y2="100" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="405" y1="100" x2="430" y2="100" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="540" y1="100" x2="565" y2="100" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="665" y1="100" x2="690" y2="100" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="180" width="760" height="120" rx="10" fill="#fff8f0" stroke="#e6a700" stroke-width="1.5"/>
