  <line x1="255" y1="235" x2="275" y2="235" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="395" y1="235" x2="415" y2="235" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="515" y1="235" x2="535" y2="235" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="645" y1="235" x2="665" y2="235" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M615,125 C615,160 615,180 615,210" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="4" fill="none" marker-end="url(#a)"/>
  <text x="625" y="170" class="s" fill="#6f42c1">检索</text>
