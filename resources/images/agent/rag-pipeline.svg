  <rect x="535" y="210" width="110" height="50" class="box" fill="#f8d7da" stroke="#dc3545"/>
  <text x="590" y="228" text-anchor="middle" class="t" fill="#721c24">Context Packing</text>
  <text x="590" y="242" text-anchor="middle" class="l">Prompt + Retrieved</text>
  <text x="590" y="255" text-anchor="middle" class="l">Chunks (stuff/map-reduce)</text>
  <rect x="665" y="210" width="100" height="50" class="box" fill="#d4edda" stroke="#28a745"/>
  <text x="715" y="230" text-anchor="middle" class="t" fill="#155724">LLM Generate</text>
  <text x="715" y="245" text-anchor="middle" class="l">生成 grounded</text>
  <text x="715" y="255" text-anchor="middle" class="l">answer</text>
